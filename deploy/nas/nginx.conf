server {
    listen 8080;
    server_name _;
    root /srv/public;
    server_tokens off;
    autoindex off;
    charset utf-8;
    add_header X-Content-Type-Options nosniff always;
    location ~ (^|/)\. { deny all; }
    location / {
        limit_except GET { deny all; }
        try_files $uri =404;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "public, max-age=3600";
    }
    location /downloads/ {
        limit_except GET { deny all; }
        try_files $uri =404;
        types { }
        default_type application/octet-stream;
        add_header Content-Disposition attachment;
        add_header X-Content-Type-Options nosniff always;
    }
}
